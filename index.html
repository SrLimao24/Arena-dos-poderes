<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena dos Poderes</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
body{margin:0;background:#12121c;color:#fff;font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#menu{padding:20px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin:auto;width:100%}
input,button{font-size:18px;padding:12px;border-radius:10px;border:0;font-family:inherit}
input{background:#262638;color:#fff;text-transform:uppercase;user-select:text;-webkit-user-select:text}
button{background:#5b5bff;color:#fff;font-weight:700}
.ch{display:flex;gap:8px}.ch button{flex:1;background:#262638;font-size:14px;padding:12px 4px}.ch button.on{background:#ff9f1a;color:#000}
#game{display:none;flex-direction:column;height:100%;position:relative}
canvas{width:min(100vw,60dvh);height:min(100vw,60dvh);display:block;margin:0 auto;background:#1b1b2b}
#ctl{flex:1;display:flex;justify-content:space-between;align-items:center;padding:8px 18px}
#joy{width:140px;height:140px;border-radius:50%;background:#ffffff18;position:relative}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:#ffffff55}
#btns{display:flex;gap:10px}
#btns button{width:68px;height:68px;border-radius:50%;font-size:20px;padding:0}
#ov{position:absolute;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-size:22px}
#again{display:none}
</style></head><body>
<div id="menu">
<h2>⚔️ Arena dos Poderes</h2>
<input id="nm" placeholder="Seu nome" maxlength="10">
<div class="ch" id="chs"></div>
<button id="mk">Criar sala</button>
<input id="cd" placeholder="Código da sala" maxlength="4">
<button id="jn">Entrar na sala</button>
<div id="err" style="color:#ff8a80"></div>
</div>
<div id="game">
<canvas id="cv" width="400" height="400"></canvas>
<div id="ctl"><div id="joy"><div id="knob"></div></div>
<div id="btns"><button data-i="0">1</button><button data-i="1">2</button><button data-i="2">3</button></div></div>
<div id="ov"><div id="ovt"></div><button id="again">Revanche</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ====== COLE AQUI O SEU firebaseConfig (precisa ter databaseURL) ======
const FIREBASE_CONFIG={
  apiKey:"COLE_AQUI",
  authDomain:"COLE_AQUI",
  databaseURL:"COLE_AQUI",
  projectId:"mundo-tabuleiros",
  appId:"COLE_AQUI"
};
// ======================================================================
const CH=[
{n:"Ki",c:"#ffb300",a:[
 {k:"melee",dmg:8,cd:350,rng:30,r:26,life:150,col:"#ffd54a"},
 {k:"proj",dmg:12,cd:900,sp:380,r:9,n:1,life:1300,col:"#4fc3f7"},
 {k:"beam",dmg:28,cd:5000,len:400,w:32,life:350,col:"#fff59d"}]},
{n:"Maldição",c:"#9c6bff",a:[
 {k:"melee",dmg:11,cd:450,rng:36,r:32,life:150,col:"#d1b3ff"},
 {k:"proj",dmg:7,cd:1100,sp:320,r:8,n:3,spread:.3,life:1300,col:"#ff5c8a"},
 {k:"blast",dmg:24,cd:5000,r:110,life:400,col:"#7c4dff"}]},
{n:"Tempo",c:"#26c6a6",a:[
 {k:"melee",dmg:8,cd:300,rng:28,r:24,life:150,col:"#a7ffeb"},
 {k:"melee",dmg:10,cd:1500,rng:30,r:28,mv:140,life:150,col:"#ffffff"},
 {k:"blast",dmg:8,cd:6000,r:150,stun:1500,life:400,col:"#18ffff"}]}
];
const $=id=>document.getElementById(id),cv=$("cv"),g=cv.getContext("2d");
const cl=v=>Math.max(14,Math.min(386,v));
let db,room,me="p1",op="p2",code,ch=0,name="",lastRound=-1,state={s:"wait",n:0};
const P={x:70,y:200,hp:100,st:0,cd:[0,0,0]},O={x:330,y:200,tx:330,ty:200,hp:100,c:0,n:"",lastA:null,init:false};
let fx=[],jx=0,jy=0,K={w:0,a:0,s:0,d:0};
CH.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c.n;b.onclick=()=>{ch=i;[...$("chs").children].forEach((x,j)=>x.classList.toggle("on",j==i))};$("chs").append(b)});
$("chs").children[0].classList.add("on");
function msg(t,btn){$("ov").style.display=t?"flex":"none";$("ovt").innerHTML=t;$("again").style.display=btn?"block":"none"}
function err(t){$("err").textContent=t}
function start(){
  if(FIREBASE_CONFIG.apiKey==="COLE_AQUI"){err("Cole o firebaseConfig no topo do arquivo.");return false}
  name=($("nm").value.trim()||"Lutador").slice(0,10);
  if(!db){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database()}
  return true}
function show(){$("menu").style.display="none";$("game").style.display="flex"}
$("mk").onclick=async()=>{
  if(!start())return;
  code=Math.random().toString(36).slice(2,6).toUpperCase();
  me="p1";op="p2";room=db.ref("rooms/"+code);
  try{await room.set({s:{s:"wait",n:0},p1:{n:name,c:ch,x:70,y:200,hp:100,st:0}})}catch(e){err("Erro no Firebase: "+e.message);return}
  show();msg("Código da sala:<br><b style='font-size:56px'>"+code+"</b><br>Mande pro amigo e espere...");listen()};
$("jn").onclick=async()=>{
  if(!start())return;
  code=$("cd").value.trim().toUpperCase();if(code.length<4){err("Digite o código.");return}
  me="p2";op="p1";room=db.ref("rooms/"+code);
  try{const s=await room.once("value");
    if(!s.exists()){err("Sala não encontrada.");return}
    if(s.val().p2){err("Sala cheia.");return}
    await room.child("p2").set({n:name,c:ch,x:330,y:200,hp:100,st:0})}catch(e){err("Erro no Firebase: "+e.message);return}
  P.x=330;show();msg("Entrando...");listen()};
function listen(){
  room.child(op).on("value",s=>{const v=s.val();if(!v)return;
    O.tx=v.x;O.ty=v.y;O.hp=v.hp;O.c=v.c;O.n=v.n;O.stun=v.st;
    if(!O.init){O.init=true;O.x=v.x;O.y=v.y;O.lastA=v.a&&v.a.id}
    else if(v.a&&v.a.id!==O.lastA){O.lastA=v.a.id;spawn(v.a,false)}
    if(me==="p1"&&state.s==="wait")room.child("s").set({s:"fight",n:1})});
  room.child("s").on("value",s=>{const v=s.val();if(!v)return;state=v;
    if(v.s==="fight"&&v.n!==lastRound){lastRound=v.n;reset()}
    if(v.s==="over")msg(v.w===me?"🏆 Você venceu!":"💀 Você perdeu",true)})}
function reset(){
  P.x=me==="p1"?70:330;P.y=200;P.hp=100;P.st=0;P.cd=[0,0,0];O.hp=100;fx=[];msg("");
  room.child(me).update({x:P.x,y:P.y,hp:100,st:0})}
$("again").onclick=()=>room.child("s").set({s:"fight",n:state.n+1});
function spawn(a,mine){
  const d=CH[mine?ch:O.c].a[a.i],n=d.n||1;
  for(let j=0;j<n;j++){const ang=Math.atan2(a.dy,a.dx)+(n>1?(j-(n-1)/2)*d.spread:0);
    fx.push({d,mine,x:a.x,y:a.y,dx:Math.cos(ang),dy:Math.sin(ang),t:performance.now(),hit:false})}}
function atk(i){
  const d=CH[ch].a[i],t=performance.now();
  if(state.s!=="fight"||P.hp<=0||t<P.st||t<P.cd[i])return;
  P.cd[i]=t+d.cd;
  let dx=O.x-P.x,dy=O.y-P.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  if(d.mv){P.x=cl(P.x+dx*d.mv);P.y=cl(P.y+dy*d.mv)}
  const a={id:Date.now()+Math.random().toString(36).slice(2,5),i,x:Math.round(P.x),y:Math.round(P.y),dx,dy};
  spawn(a,true);room.child(me).update({a,x:a.x,y:a.y})}
document.querySelectorAll("#btns button").forEach(b=>b.onpointerdown=e=>{e.preventDefault();atk(+b.dataset.i)});
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k in K)K[k]=1;if("123".includes(k)&&k)atk(+k-1)});
addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k in K)K[k]=0});
// joystick
const joy=$("joy"),kn=$("knob");let jd=false;
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-70,dy=e.clientY-r.top-70;const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{jd=true;joy.setPointerCapture(e.pointerId);jm(e)};
joy.onpointermove=e=>{if(jd)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jd=false;jx=jy=0;kn.style.transform=""};
// colisão
function segd(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay;let t=((px-ax)*vx+(py-ay)*vy)/(vx*vx+vy*vy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*vx,py-ay-t*vy)}
function pos(f,age){const d=f.d;return d.k==="proj"?[f.x+f.dx*d.sp*age/1000,f.y+f.dy*d.sp*age/1000]:d.k==="melee"?[f.x+f.dx*d.rng,f.y+f.dy*d.rng]:[f.x,f.y]}
function hits(f,age){
  const d=f.d,[px,py]=pos(f,age);
  if(d.k==="beam")return segd(P.x,P.y,f.x,f.y,f.x+f.dx*d.len,f.y+f.dy*d.len)<d.w/2+14;
  if(d.k==="blast")return Math.hypot(P.x-px,P.y-py)<d.r;
  return Math.hypot(P.x-px,P.y-py)<d.r+14}
let last=performance.now(),sent=0,flash=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  const fight=state.s==="fight";
  if(fight&&P.hp>0&&t>=P.st){
    let vx=jx+K.d-K.a,vy=jy+K.s-K.w;const l=Math.hypot(vx,vy);if(l>1){vx/=l;vy/=l}
    P.x=cl(P.x+vx*170*dt);P.y=cl(P.y+vy*170*dt)}
  const k=Math.min(1,dt*14);O.x+=(O.tx-O.x)*k;O.y+=(O.ty-O.y)*k;
  fx=fx.filter(f=>{
    const age=t-f.t,d=f.d;if(age>d.life)return false;
    if(!f.mine&&!f.hit&&fight&&P.hp>0&&hits(f,age)){
      f.hit=true;P.hp=Math.max(0,P.hp-d.dmg);flash=t+120;if(d.stun)P.st=t+d.stun;
      room.child(me).update({hp:P.hp,st:d.stun?1:0});
      if(d.k==="proj")return false}
    return true});
  if(fight&&P.hp<=0){state={...state,s:"over"};room.child("s").set({s:"over",n:state.n,w:op})}
  if(t-sent>66&&room){sent=t;room.child(me).update({x:Math.round(P.x),y:Math.round(P.y),hp:P.hp,st:P.st>t?1:0})}
  draw(t);
  document.querySelectorAll("#btns button").forEach((b,i)=>{const r=P.cd[i]-t;b.textContent=r>0?(r/1000).toFixed(1):i+1;b.style.opacity=r>0?.45:1});
  requestAnimationFrame(loop)}
function draw(t){
  g.clearRect(0,0,400,400);g.strokeStyle="#ffffff10";g.lineWidth=1;
  for(let i=0;i<=400;i+=40){g.beginPath();g.moveTo(i,0);g.lineTo(i,400);g.moveTo(0,i);g.lineTo(400,i);g.stroke()}
  fx.forEach(f=>{
    const age=t-f.t,d=f.d,[px,py]=pos(f,age);
    g.globalAlpha=Math.max(.2,1-age/d.life*(d.k==="proj"?.3:1));g.fillStyle=g.strokeStyle=d.col;
    if(d.k==="beam"){g.lineWidth=d.w;g.lineCap="round";g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.x+f.dx*d.len,f.y+f.dy*d.len);g.stroke()}
    else{g.beginPath();g.arc(px,py,d.k==="blast"?d.r:d.r,0,7);d.k==="blast"?g.stroke():g.fill()}
    g.globalAlpha=1});
  g.lineWidth=3;
  const pl=(o,c,n,me_)=>{g.fillStyle=c;g.fillRect(o.x-14,o.y-14,28,28);
    if(o.st>t||(!me_&&o.stun)){g.strokeStyle="#ff0";g.strokeRect(o.x-17,o.y-17,34,34)}
    g.fillStyle="#fff";g.font="12px sans-serif";g.textAlign="center";g.fillText(n,o.x,o.y-20)};
  g.globalAlpha=1;
  pl(O,CH[O.c].c,O.n,false);
  pl(P,t<flash?"#fff":CH[ch].c,name,true);
  g.lineWidth=1;
  [[6,P.hp,name],[234,O.hp,O.n]].forEach(([x,h,n])=>{g.fillStyle="#400";g.fillRect(x,6,160,10);g.fillStyle="#3ddc84";g.fillRect(x,6,160*h/100,10)})}
requestAnimationFrame(loop);
</script></body></html>
